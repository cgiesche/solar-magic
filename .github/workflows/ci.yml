# Tests run on every push to develop (incl. merged PRs). On every push to master/develop the Docker image
# is built and pushed – on develop only when the tests pass: master → registry.traumwald.net/smw-editor:latest,
# develop → :develop (each also as :sha-<commit>).
name: CI

on:
  push:
    branches: [master, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: registry.traumwald.net/smw-editor

jobs:
  test:
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # The ROM is not in the repository (see test/fixtures/README.md)
      - name: Download ROM
        env:
          SMW_ROM_URL: ${{ secrets.SMW_ROM_URL }}
        run: curl -fsSL "$SMW_ROM_URL" -o test/fixtures/smw.smc

      - run: npm run typecheck
      - run: npm test

  docker:
    needs: test
    # the test job is skipped on master
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the build number counts the commits

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - id: version
        run: echo "version=$(node tools/version.ts)" >> "$GITHUB_OUTPUT"

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' }}
            type=raw,value=develop,enable=${{ github.ref == 'refs/heads/develop' }}
            type=sha

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: registry.traumwald.net
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          build-args: |
            COMMIT=${{ github.sha }}
            VERSION=${{ steps.version.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
