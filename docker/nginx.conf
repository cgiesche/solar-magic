# the same image serves the release (smw.traumwald.net) and the dev build (smw-dev.traumwald.net): search engines index only the release
map $host $robots_tag {
  smw-dev.traumwald.net "noindex, nofollow";
  default "";
}

server {
  listen 80;
  root /usr/share/nginx/html;

  gzip on;
  gzip_types text/css application/javascript application/wasm application/xml;

  # hashed file names: cache forever
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Robots-Tag $robots_tag;
  }

  location / {
    add_header Cache-Control "no-cache";
    add_header X-Robots-Tag $robots_tag;
    try_files $uri /index.html;
  }
}
